# Opens a pull request when a new major version of one of the actions used in
# .github/workflows/authz.yml is released. Minor and patch releases arrive
# through the major tags (@v6, @v2) without a pull request.
#
# The OPA range (1.x) and the check-jsonschema range (<1) in that workflow are
# outside Dependabot's reach; they follow their major on their own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
